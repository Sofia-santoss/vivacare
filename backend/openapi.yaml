        '403': { $ref: '#/components/responses/Erro' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: vivacare_session
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
  parameters:
    CodigoPesquisa:
      name: codigo
      in: path
      required: true
      schema: { type: string, minLength: 1 }
      description: Slug de setor ou UUID público.
    CodigoUuid:
      name: codigo
      in: path
      required: true
      schema: { type: string, format: uuid }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^[1-9][0-9]*$' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid, pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$' }
      description: UUIDv4 aleatório; repetir a chave com payload distinto gera conflito.
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
    Origin:
      name: Origin
      in: header
      required: true
      schema: { type: string, format: uri }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
  responses:
    Erro:
      description: Erro de validação, autenticação, autorização ou disponibilidade
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    Lista:
      description: Lista paginada
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items: { type: object, additionalProperties: true }
              pagination:
                $ref: '#/components/schemas/Paginacao'
    Registro:
      description: Registro retornado
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { type: object, additionalProperties: true }
  schemas:
    Erro:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        error: { type: string }
    Paginacao:
      type: object
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
    Principal:
      type: object
      properties:
        userId: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        hospitalId: { type: string }
        profile:
          type: object
          properties:
            id: { type: string }
            code: { type: string }
            name: { type: string }
        sectorIds:
          type: array
          items: { type: string }
    PerguntaPesquisa:
      type: object
      properties:
        id: { type: string }
        text: { type: string }
        stage: { type: string, enum: [GERAL, RECEPCAO, TRIAGEM, ENFERMAGEM, MEDICO] }
        answerType: { type: string, enum: [TEXTO, NOTA, OPCAO, SIM_NAO] }
        required: { type: boolean }
        position: { type: integer }
    PesquisaPublica:
      type: object
      properties:
        id: { type: string }
        publicCode: { type: string, format: uuid }
        title: { type: string }
        description: { type: [string, 'null'] }
        sectorName: { type: string }
        questions:
          type: array
          items: { $ref: '#/components/schemas/PerguntaPesquisa' }
    RespostaAnonima:
      type: object
      additionalProperties: false
      required: [nps, answers]
      properties:
        nps: { type: integer, minimum: 0, maximum: 10 }
        answers:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [questionId, value]
            properties:
              questionId: { type: string, pattern: '^[1-9][0-9]*$' }
              value:
                oneOf:
                  - { type: string, maxLength: 4000 }
                  - { type: integer, minimum: 0, maximum: 10 }
                  - { type: boolean }
    SubmissaoAnonimaV2:
      type: object
      additionalProperties: false
      required: [notaNps, respostas]
      properties:
        notaNps: { type: integer, minimum: 0, maximum: 10 }
        respostas:
          type: array
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [perguntaId, valor]
            properties:
              perguntaId: { type: string, pattern: '^[1-9][0-9]*$' }
              valor:
                oneOf:
                  - { type: string, maxLength: 5000 }
                  - { type: integer, minimum: 0, maximum: 10 }
                  - { type: boolean }
    ResultadoSubmissao:
      type: object
      properties:
        status: { type: string, enum: [submitted, already_submitted] }
    ManifestacaoPublica:
      type: object
      additionalProperties: false
      required: [type, phone, statement, consent]
      properties:
        type: { type: string, enum: [ELOGIO, RECLAMACAO, SUGESTAO] }
        name: { type: string, maxLength: 150 }
        phone: { type: string, description: Telefone brasileiro com DDD. }
        statement: { type: string, minLength: 1, maxLength: 5000 }
        consent: { type: boolean, const: true }
    ResultadoOuvidoria:
      type: object
      properties:
        status: { type: string, enum: [submitted, already_submitted] }
        protocol: { type: string }
    IndicadorNps:
      type: object
      properties:
        setor_id: { type: string }
        setor: { type: string }
        data_resposta: { type: string, format: date }
        turno_id: { type: [string, 'null'] }
        turno: { type: [string, 'null'] }
        total_respostas: { type: string }
        total_promotores: { type: string }
        total_neutros: { type: string }
        total_detratores: { type: string }
        nps: { type: string }
