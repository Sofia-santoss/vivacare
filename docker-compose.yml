services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vivacare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vivacare-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-vivacare}
    ports:
      - "5432:5432"
    volumes:
      - vivacare-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vivacare} -d ${POSTGRES_DB:-vivacare}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vivacare-postgres:
